version: 2
updates:
- package-ecosystem: gomod
  directories:
    - "/"
    - "/tools/upgrader"
  schedule:
    interval: daily
    time: "13:00"
  open-pull-requests-limit: 10
  allow:
    - dependency-type: all
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
- package-ecosystem: "docker"
  directory: "/tools"
  schedule:
    interval: "daily"
