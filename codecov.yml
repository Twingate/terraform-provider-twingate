codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

# Acceptance tests don't run on fork PRs, so their flags would otherwise
# report as a coverage drop instead of "unchanged".
flag_management:
  default_rules:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "twingate/internal/test/**"
  - "tools/**"
  - "examples/**"
